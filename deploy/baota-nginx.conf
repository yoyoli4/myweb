# 宝塔 Nginx 反向代理配置（Next.js + PM2 模式）
#
# 使用方法：
# 1. 宝塔面板 → 网站 → 添加站点 → 绑定你的域名（根目录随便填，会被下面覆盖）
# 2. 进入站点 → 设置 → 反向代理 → 添加反向代理
#    - 代理名称：sicksuckworld
#    - 目标 URL：http://127.0.0.1:3000
#    - 发送域名：$host
#    - 开启：带端口 / 保留路径
# 3. 或者把下面配置粘贴到 站点设置 → 配置文件 → 覆盖原 server block
#
# 注意：如果你直接用下面的 server block 覆盖，把 server_name 改成你的域名，
#       把 root 改成你的项目目录下的 public 路径（用于静态资源兜底）。

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;  # ← 改成你的域名

    # 日志
    access_log /www/wwwlogs/sicksuckworld.log;
    error_log  /www/wwwlogs/sicksuckworld.error.log;

    # gzip 压缩（宝塔默认可能已有，重复无害）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Next.js 静态资源直接由 Nginx 提供（性能更好）
    location /_next/static/ {
        alias /www/wwwroot/sicksuckworld/.next/static/;  # ← 改成你的项目路径
        access_log off;
        expires 365d;
    }

    # 图片/音乐等 public 静态资源
    location /images/ {
        alias /www/wwwroot/sicksuckworld/public/images/;  # ← 改成你的项目路径
        access_log off;
        expires 30d;
    }
    location /music/ {
        alias /www/wwwroot/sicksuckworld/public/music/;  # ← 改成你的项目路径
        access_log off;
        expires 365d;
    }

    # 其余全部反代到 Next.js (PM2)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # 留言板可能有较大请求体（音频 base64）
        client_max_body_size 20m;
    }
}
